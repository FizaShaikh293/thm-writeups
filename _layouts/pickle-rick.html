<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ page.title }}</title>

<style>
body {
  margin: 0;
  font-family: "Courier New", monospace;
  background: #050805;
  color: #00ff88;
}

/* 🌌 neon animated background (top effect) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,255,120,0.15), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(0,255,255,0.10), transparent 40%),
    radial-gradient(circle at 50% 80%, rgba(0,255,120,0.10), transparent 50%);
  animation: pulse 6s infinite alternate;
  z-index: -1;
}

@keyframes pulse {
  from { transform: scale(1); filter: blur(0px); }
  to { transform: scale(1.05); filter: blur(2px); }
}

/* header */
header {
  text-align: center;
  padding: 25px;
  border-bottom: 1px solid #00ff88;
  text-shadow: 0 0 10px #00ff88;
}

header h1 {
  margin: 0;
}

/* main content wrapper */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* INFO CARD ONLY (kept as you wanted) */
.info-card {
  border: 1px solid #00ff88;
  padding: 10px;
  margin: 20px 0;
  background: rgba(0, 30, 15, 0.35);
  white-space: pre;
}

/* optional: keep markdown code blocks readable */
pre, code {
  background: #001a10;
  padding: 8px;
  overflow-x: auto;
  border-left: 3px solid #00ff88;
}

/* links */
a {
  color: #66ffcc;
}

/* CTF flags */
details {
  border: 1px solid #00ff88;
  padding: 10px;
  margin: 10px 0;
}

summary {
  color: #66ffcc;
  cursor: pointer;
}

.flag {
  margin-top: 10px;
  padding: 8px;
  background: #001a10;
  border-left: 3px solid #00ff88;
}
</style>
</head>

<body>

<header>
  <h1>🧪 Pickle Rick Writeup</h1>
</header>

<div class="container">
  {{ content }}
</div>

</body>
</html>
